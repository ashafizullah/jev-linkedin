<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Jev Job Match</title>
    <style>
      :root {
        --bg: #0b1526;
        --card: #101d33;
        --line: #1f3358;
        --text: #e8eefc;
        --muted: #8fa5c7;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 288px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        border-right-color: #facc15;
      }
      h1 { margin: 0; font-size: 13px; font-weight: 600; }
      .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      .dot.ok { background: #22c55e; }
      .dot.bad { background: #f87171; }
      .muted { color: var(--muted); font-size: 11.5px; margin: 0; }
      button {
        width: 100%;
        background: var(--accent);
        color: #07182c;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #7dd3fc; }
      button.ghost {
        background: transparent;
        color: #c3d3ee;
        border-color: #2b4066;
      }
      button.ghost:hover { background: #1b2d4d; }
      code { background: #17263f; padding: 1px 5px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div class="head"><span class="logo"></span><h1>Jev Job Match</h1></div>
    <div class="body">
      <div class="row">
        <span id="cfgDot" class="dot bad"></span><span id="cfgText" data-i18n="common.checking"></span>
      </div>
      <div class="row">
        <span id="cvDot" class="dot bad"></span><span id="cvText" data-i18n="common.checking"></span>
      </div>
      <p class="muted"><span data-i18n="popup.modelLabel"></span> <code id="model">—</code></p>
      <p class="muted"><span data-i18n="popup.historyLabel"></span> <b id="history">0</b></p>
      <p class="muted" data-i18n="popup.hint"></p>
      <button id="openJobs" type="button" data-i18n="popup.openJobs"></button>
      <button id="openDashboard" class="ghost" type="button" data-i18n="dashboard.open"></button>
      <button id="openOptions" class="ghost" type="button" data-i18n="popup.openSettings"></button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
